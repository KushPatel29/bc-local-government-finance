name: bc_finance
version: "1.0.0"
config-version: 2
profile: bc_finance

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  bc_finance:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      # Gold: each mart is also written as a CSV the Excel workbook loads.
      +materialized: external
      +format: csv

seeds:
  bc_finance:
    known_exceptions:
      +column_types:
        year: integer
        difference: double
    missing_statements:
      +column_types:
        year: integer
